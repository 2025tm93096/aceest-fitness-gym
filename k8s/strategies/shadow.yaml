apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: ACEEST_DB
              value: /tmp/aceest-shadow.db
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: shadow-data
              mountPath: /tmp
      volumes:
        - name: shadow-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  selector:
    app: aceest-shadow
  ports:
    - name: http
      port: 80
      targetPort: http
