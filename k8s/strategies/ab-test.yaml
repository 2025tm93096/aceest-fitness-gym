apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-test
  namespace: aceest
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: X-Aceest-Experiment
    nginx.ingress.kubernetes.io/canary-by-header-value: variant-b
spec:
  ingressClassName: nginx
  rules:
    - host: aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-canary
                port:
                  number: 80
